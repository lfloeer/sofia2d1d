[build-system]
requires = ["setuptools>=77", "cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sofia2d1d"
version = "0.2.0"
description = "Fast 2D-1D wavelet de-noising of spectral data cubes for source finding (SoFiA)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lars Flöer" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.25"]
keywords = ["astronomy", "radio astronomy", "wavelets", "denoising", "source finding", "spectral cubes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/lfloeer/sofia2d1d"
"Flöer & Winkel 2012" = "https://doi.org/10.1071/AS11042"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["sofia2d1d"]
include-package-data = false

[tool.setuptools.package-data]
sofia2d1d = ["py.typed", "*.pyi"]

[tool.uv]
# Rebuild the extension whenever its sources or the build configuration change
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/sofia2d1d/*.pyx" },
    { file = "src/sofia2d1d/*.h" },
    { env = "SOFIA2D1D_NATIVE" },
    { env = "SOFIA2D1D_NO_OPENMP" },
    { env = "SOFIA2D1D_LIBOMP_PREFIX" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["sofia2d1d", "reference"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_i686 *-win32 *-manylinux_i686"
test-groups = ["dev"]
test-command = "pytest -q {project}/tests"
